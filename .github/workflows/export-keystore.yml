name: Export keystore backup

# Eenmalig: schrijft de KEYSTORE_B64-secret naar een artifact zodat we de signing-keystore
# durable kunnen back-uppen (secrets zijn write-only). Daarna wordt de run + workflow verwijderd.
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Emit keystore
        run: printf '%s' "${{ secrets.KEYSTORE_B64 }}" > jarvis.keystore.b64
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: jarvis.keystore.b64
