name: Generate keystore

# Eenmalig: genereert de stabiele signing-keystore (keytool zit in de Java-toolchain van de runner)
# en levert 'm base64 als artifact. Daarna wordt die base64 als secret KEYSTORE_B64 gezet en deze
# workflow verwijderd. De keystore mag NOOIT veranderen, anders kunnen bestaande installs niet updaten.
on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore jarvis.keystore -alias "${{ secrets.KEY_ALIAS }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEY_PASSWORD }}" \
            -dname "CN=Jarvis, OU=TechDog, O=TechDog, L=NA, ST=NA, C=NL"
          base64 -w0 jarvis.keystore > jarvis.keystore.b64
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-b64
          path: jarvis.keystore.b64
